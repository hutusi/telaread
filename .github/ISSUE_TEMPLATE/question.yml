      value: |
        The [About page](https://telaread.com/about) answers many questions. For anything about your own account or data, email me@hutu.si instead: this repository is public.

        [关于页面](https://telaread.com/about)可以解答很多问题。涉及你自己的账户或数据，请发邮件到 me@hutu.si：这个仓库是公开的。
